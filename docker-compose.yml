x-app-env: &app-env
  APP_BOOTSTRAP: "1"
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"

x-app-build: &app-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

services:
  app:
    build: *app-build
    image: notification-service/app:dev
    container_name: ns-app
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    volumes:
      - ./:/var/www
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ns]

  nginx:
    image: nginx:stable-alpine
    container_name: ns-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: { condition: service_started }
    networks: [ns]

  worker:
    build: *app-build
    image: notification-service/app:dev
    container_name: ns-worker
    restart: unless-stopped
    command: /var/www/docker/worker/entrypoint.sh
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    volumes:
      - ./:/var/www
    depends_on:
      app:      { condition: service_started }
      rabbitmq: { condition: service_healthy }
    networks: [ns]

  scheduler:
    build: *app-build
    image: notification-service/app:dev
    container_name: ns-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    volumes:
      - ./:/var/www
    depends_on:
      app: { condition: service_started }
    networks: [ns]

  postgres:
    image: postgres:18-alpine
    container_name: ns-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-notification_service}
      POSTGRES_USER:     ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-notification_service}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ns]

  redis:
    image: redis:8-alpine
    container_name: ns-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ns]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ns-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT_HOST:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ns]

  mailpit:
    image: axllent/mailpit:latest
    container_name: ns-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks: [ns]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  ns:
    driver: bridge
